<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SwiftCheck — Details</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      .wrap {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .dial-card {
        padding: 22px 16px 16px;
      }
      .dial-wrap {
        width: 280px;
        height: 152px;
      }
      .dial-svg {
        width: 280px;
        height: 152px;
      }
      .speed-val {
        font-size: 78px;
      }
      .speed-unit {
        font-size: 15px;
      }

      .btn {
        width: 100%;
        padding: 13px 0;
        font-size: 17px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card header">
        <div class="logo">
          <div class="lmark">
            <svg viewBox="0 0 16 16" fill="none">
              <path
                d="M8 2L8 8L12 5"
                stroke="white"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="8" cy="8" r="2" fill="white" opacity="0.9" />
              <path
                d="M3 13 Q8 7 13 13"
                stroke="white"
                stroke-width="1.2"
                fill="none"
                opacity="0.55"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div>
            <div class="lname">SwiftCheck</div>
            <div class="lsub">Speed Test — Details</div>
          </div>
        </div>
        <div class="hdr-r">
          <button class="ubtn" id="unitBtn">MB/s</button>
          <button class="tbtn" id="themeBtn">
            <div class="tthumb" id="themeThumb"></div>
            <span class="temoji" id="themeEmoji">🌙</span>
          </button>
          <div class="status">
            <div class="dot" id="dot"></div>
            <span id="statusText">READY</span>
          </div>
        </div>
      </div>

      <div class="last-tested" id="lastTested"></div>

      <div class="card dial-card">
        <div class="dial-wrap">
          <svg class="dial-svg" viewBox="0 0 228 124" id="dialSvg">
            <path
              d="M 14 114 A 100 100 0 0 1 214 114"
              fill="none"
              class="dial-track"
              stroke-width="10"
              stroke-linecap="round"
            />
            <path
              d="M 14 114 A 100 100 0 0 1 214 114"
              fill="none"
              class="dial-arc"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="314"
              stroke-dashoffset="314"
              id="dialArc"
              style="
                transition: stroke-dashoffset 0.45s cubic-bezier(0.4, 0, 0.2, 1);
              "
            />
            <g id="ticks"></g>
            <g id="scaleLabels"></g>
            <g
              id="needle"
              transform="rotate(-90 114 114)"
              style="
                transition: transform 0.5s cubic-bezier(0.34, 1.25, 0.64, 1);
              "
            >
              <line
                x1="114"
                y1="114"
                x2="114"
                y2="26"
                class="needle-line"
                stroke-width="2.5"
                stroke-linecap="round"
                id="needleLine"
              />
              <polygon
                points="112,114 116,114 115,30 113,30"
                class="needle-poly"
                id="needlePoly"
              />
            </g>
            <circle cx="114" cy="114" r="5" class="pivot-dot" id="pivotDot" />
            <text
              id="dialMaxLabel"
              x="114"
              y="108"
              text-anchor="middle"
              font-size="9"
              font-family="JetBrains Mono,monospace"
            ></text>
          </svg>
        </div>
        <div class="speed-display">
          <div class="speed-val" id="speedVal">—</div>
          <div class="speed-unit" id="speedUnitLabel">MB/s</div>
        </div>
        <div class="phase-label" id="phaseLabel">READY TO TEST</div>
      </div>

      <div class="stats">
        <div class="card stat" id="cardPing">
          <div class="stat-label">Ping</div>
          <div class="stat-val" id="valPing">—</div>
          <div class="stat-unit">ms</div>
        </div>
        <div class="card stat" id="cardDl">
          <div class="stat-label">Down</div>
          <div class="stat-val" id="valDl">—</div>
          <div class="stat-unit" id="unitDl">MB/s</div>
        </div>
        <div class="card stat" id="cardUl">
          <div class="stat-label">Up</div>
          <div class="stat-val" id="valUl">—</div>
          <div class="stat-unit" id="unitUl">MB/s</div>
        </div>
      </div>

      <div class="card progress-card">
        <div class="progress-top">
          <div class="prog-phase" id="progressPhase">IDLE</div>
          <div class="prog-pct" id="progressPct">0%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      </div>

      <div class="rating-row">
        <span class="rating-label" id="ratingLabel" style="opacity: 0"
          >Connection:</span
        >
        <span class="rating-badge" id="ratingBadge"></span>
      </div>

      <div class="btn-wrap">
        <button class="btn" id="startBtn">
          <span id="btnText">▶ Run Test</span>
        </button>
      </div>

      <div class="footer" id="footerText">NO DATA STORED · v1.4</div>
    </div>
    <script src="engine.js"></script>
    <script src="dial.js"></script>
    <script src="details.js"></script>
  </body>
</html>
